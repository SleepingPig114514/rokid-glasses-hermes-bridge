name: rokid-bridge
label: Rokid Glasses Hermes Bridge
kind: platform
version: 1.2.0
description: >
  Standalone Hermes Agent platform adapter for Rokid AR glasses. Connects
  directly to the Rokid RCS outbound WebSocket
  (wss://rcs.rokid.com/claw/ws/link) using the device pairing credentials
  (linkCode/linkSecret) — no public endpoint and no separate OpenClaw plugin
  required. Supports glasses voice/text/photo input, answer output, and device
  commands (photo, navigation, calendar, exit). Photo frames are recognized via
  the configured auxiliary.vision backend.
author: custom
repository: https://gitee.com/rokid-eco/rokid-glasses-hermes-bridge
homepage: https://gitee.com/rokid-eco/rokid-glasses-hermes-bridge
tags:
  - rokid
  - ar-glasses
  - openclaw-bridge
  - platform-adapter
dependencies:
  - aiohttp>=3.9.0
provides_tools:
  - take_photo
  - take_navigation
  - control_calendar
  - notify_agent_off
requires_env:
  - name: ROKID_LINK_CODE
    description: "Device pairing link code shown on the Rokid glasses (from official OpenClaw plugin)"
    prompt: "Rokid link code"
    password: false
  - name: ROKID_LINK_SECRET
    description: "Device pairing link secret (from official OpenClaw plugin)"
    prompt: "Rokid link secret"
    password: true
optional_env:
  - name: ROKID_WS_URL
    description: "Rokid RCS WebSocket endpoint (default wss://rcs.rokid.com/claw/ws/link)"
    prompt: "Rokid WS URL"
    password: false
  - name: ROKID_AGENT_ID
    description: "agent_id reported in outbound frames (default main)"
    prompt: "Agent id"
    password: false
